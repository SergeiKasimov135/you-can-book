services:
  postgres:
    image: postgres:16
    container_name: you-can-book-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-you_can_book_db}
      POSTGRES_USER: ${POSTGRES_USER:-you_can_book}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-you_can_book}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - you-can-book-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # По TCP: через сокет pg_isready отвечает раньше, чем БД готова
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Код внутри Docker, если localhost не работает (VPN); запуск: docker compose run --rm api ...
  api:
    build: ./api-service
    profiles: ["tools"]
    environment:
      # postgres:5432 — адрес БД внутри сети compose
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-you_can_book}:${POSTGRES_PASSWORD:-you_can_book}@postgres:5432/${POSTGRES_DB:-you_can_book_db}?ssl=disable
    volumes:
      # Код монтируется, пересборка не нужна
      - ./api-service:/app
    networks:
      - you-can-book-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  you-can-book-network:
    driver: bridge

volumes:
  postgres-data:
