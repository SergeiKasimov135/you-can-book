services:
  postgres:
    image: postgres:16
    container_name: you-can-book-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-you_can_book_db}
      POSTGRES_USER: ${POSTGRES_USER:-you_can_book}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-you_can_book}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - you-can-book-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  you-can-book-network:
    driver: bridge

volumes:
  postgres-data:
