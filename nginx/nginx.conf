# Обратный прокси: статика отдаётся nginx, /api/ уходит в FastAPI (gunicorn + uvicorn-воркеры)
upstream api_backend {
    server api:8000;  # имя сервиса из docker-compose.yml
}

server {
    listen 80;
    server_name _;

    # Статические файлы: nginx отдаёт их сам, не обращаясь к приложению
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    # Запросы к API пересылаются на бэкенд
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
