<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You Can Book</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 4px; }
    .muted { color: #666; }
    li { margin: 6px 0; }
    code { background: #f2f2f2; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>You Can Book</h1>
  <p class="muted">Эту страницу отдаёт nginx как статический файл. Список ниже загружается запросом
    <code>GET /api/events</code>, который nginx проксирует в FastAPI.</p>
  <p><a href="/api/docs">Swagger UI</a> · <a href="/api/redoc">ReDoc</a> · <a href="/api/health">/api/health</a></p>
  <h2>Ближайшие мероприятия</h2>
  <ul id="events"><li class="muted">Загрузка…</li></ul>
  <script>
    fetch("/api/events")
      .then(r => r.json())
      .then(events => {
        const ul = document.getElementById("events");
        ul.innerHTML = "";
        for (const e of events) {
          const li = document.createElement("li");
          const date = new Date(e.event_date).toLocaleString("ru-RU", { dateStyle: "medium", timeStyle: "short" });
          li.textContent = `${date} — ${e.title} (${e.location.name})`;
          ul.appendChild(li);
        }
        if (!events.length) ul.innerHTML = '<li class="muted">Нет мероприятий</li>';
      })
      .catch(() => { document.getElementById("events").innerHTML = '<li>API недоступно</li>'; });
  </script>
</body>
</html>
